name: Build & Release Glance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Glance Desktop Widget Release'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binaries (Installer & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build React Client & Electron TypeScript
        run: npm run build

      - name: Package Windows Installer & Portable Binaries
        run: npx electron-builder --win nsis portable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release directory contents
        shell: powershell
        run: |
          Get-ChildItem -Path release | Select-Object Name, Length

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || format('Glance {0}', github.ref_name) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/Glance-Setup-*.exe
            release/Glance-Portable-*.exe
            release/*.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
